# =============================================================
# NetGding Redis Configuration
# =============================================================

# ----- Network -----
bind 0.0.0.0
port 6379
protected-mode no

# ----- Logging -----
loglevel notice
logfile ""

# ----- Memory -----
# Giới hạn 256MB, dùng LRU eviction khi full
maxmemory 256mb
maxmemory-policy allkeys-lru

# ----- Persistence (RDB snapshots) -----
# Ghi snapshot nếu ít nhất N keys thay đổi trong M giây
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# ----- Streams -----
# Stream consumer group idle timeout: 30 phút (ms)
# Giữ max 10000 entries mỗi stream (MAXLEN ~)
# (được set trong code: RedisOptions.StreamMaxLen)

# ----- Connection -----
tcp-keepalive 300
timeout 0

# ----- Performance -----
hz 10
dynamic-hz yes
