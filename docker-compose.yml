services:
  redis:
    image: redis:7-alpine
    container_name: netgding-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  discord:
    build:
      context: .
      dockerfile: NetGding.Services/NetGding.Discord/Dockerfile
    container_name: netgding-discord
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      Redis__ConnectionString: redis:6379
      Discord__WebApiBaseUrl: http://webapi:8080
    ports:
      - "5003:8080"
    depends_on:
      redis:
        condition: service_healthy
      webapi:
        condition: service_started
    restart: unless-stopped

  telegram:
    build:
      context: .
      dockerfile: NetGding.Services/NetGding.Telegram/Dockerfile
    container_name: netgding-telegram
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      Redis__ConnectionString: redis:6379
      Telegram__WebApiBaseUrl: http://webapi:8080
    ports:
      - "5002:8080"
    depends_on:
      redis:
        condition: service_healthy
      webapi:
        condition: service_started
    restart: unless-stopped

  webapi:
    build:
      context: .
      dockerfile: NetGding.Services/NetGding.WebAPI/Dockerfile
    container_name: netgding-webapi
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      Redis__ConnectionString: redis:6379
      WebApi__CollectorServiceUrl: http://collector:8080
    ports:
      - "5001:8080"
    volumes:
      - webapi-db:/app/db
    depends_on:
      redis:
        condition: service_healthy
      collector:
        condition: service_started
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: NetGding.Services/NetGding.Collector/Dockerfile
    container_name: netgding-collector
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      Redis__ConnectionString: redis:6379
      Collector__OutputDirectory: /app/data
      Collector__WebApiBaseUrl: http://webapi:8080
    ports:
      - "5000:8080"
    volumes:
      - collector-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  collector-data:
  webapi-db:
  redis-data:
